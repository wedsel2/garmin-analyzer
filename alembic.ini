# For developers creating migrations with the alembic CLI, for example:
#   uv run alembic revision --autogenerate -m "add sleep table"
# The application itself applies migrations with: garmin-analyzer migrate
[alembic]
script_location = src/garmin_analyzer/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
