name: Nightly image scan

# New CVEs appear in unchanged images, so rescan the latest release every night.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for a released image
        id: released
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No released image yet, nothing to scan."
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.released.outputs.exists == 'true'
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && steps.released.outputs.exists == 'true'
        with:
          sarif_file: trivy-image.sarif
          category: trivy-nightly
