{% extends "base.html" %}
{% block title %}Choose a password{% endblock %}
{% block content %}
<div class="card mx-auto mt-6 max-w-md bg-base-100 shadow-sm">
  <div class="card-body">
    <h1 class="card-title text-2xl">Choose a password</h1>
    <p class="opacity-70">For {{ email }}. You sign in with this address.</p>
    {% if error %}<p class="alert alert-error alert-soft" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/set-password/{{ token }}" class="flex flex-col gap-1">
      <input type="hidden" name="username" value="{{ email }}" autocomplete="username">
      <label class="label" for="password">Password</label>
      <input class="input w-full" id="password" name="password" type="password" autocomplete="new-password" minlength="{{ min_length }}" required>
      <p class="text-sm opacity-70">At least {{ min_length }} characters.</p>
      <label class="label mt-2" for="password_again">Password again</label>
      <input class="input w-full" id="password_again" name="password_again" type="password" autocomplete="new-password" required>
      <button class="btn btn-primary mt-4" type="submit">Save and sign in</button>
    </form>
  </div>
</div>
{% endblock %}
