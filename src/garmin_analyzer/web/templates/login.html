{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card mx-auto mt-6 max-w-sm bg-base-100 shadow-sm">
  <div class="card-body">
    <h1 class="card-title text-2xl">Sign in</h1>
    {% if error %}<p class="alert alert-error alert-soft" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="flex flex-col gap-1">
      <label class="label" for="email">Email address</label>
      <input class="input w-full" id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required>
      <label class="label mt-2" for="password">Password</label>
      <input class="input w-full" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary mt-4" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
