{# The heading of a dashboard with the periods to pick from. Needs `title`, `periods` and `active`. #}
<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <h1 class="text-2xl font-semibold">{{ title }}</h1>
  <nav class="join" aria-label="Period"
       hx-boost="true" hx-target="#dashboard" hx-select="#dashboard" hx-swap="outerHTML">
    {% for key, option in periods.items() %}
    <a class="btn join-item btn-sm {{ 'btn-primary' if key == active }}" href="?period={{ key }}"
       {% if key == active %}aria-current="true"{% endif %}>{{ option.label }}</a>
    {% endfor %}
  </nav>
</div>
