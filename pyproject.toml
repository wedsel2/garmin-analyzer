[project]
name = "garmin-analyzer"
# Placeholder: release versions come from git tags created by semantic-release.
version = "0.0.0"
description = "Collects Garmin metrics into PostgreSQL for analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "garminconnect==0.3.17",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
garmin-analyzer = "garmin_analyzer.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Ships without type information; wrapped in garmin_analyzer.garmin.
module = "garminconnect.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml"

[tool.coverage.run]
source = ["garmin_analyzer"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "testcontainers[postgres]>=4.15.0",
]
