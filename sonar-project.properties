sonar.organization=wedsel2
sonar.projectKey=wedsel2_garmin-analyzer

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# Fail the CI job when the quality gate fails.
sonar.qualitygate.wait=true

# Migrations are generated schema snapshots: similar column lists are expected,
# and they are exercised through the migration tests, not line coverage.
sonar.cpd.exclusions=src/garmin_analyzer/migrations/versions/**
# The chart script runs in the browser and has no automated tests: there is no
# JavaScript toolchain (ADR 7). It is still analysed for issues.
sonar.coverage.exclusions=src/garmin_analyzer/migrations/**,src/garmin_analyzer/web/static/**
