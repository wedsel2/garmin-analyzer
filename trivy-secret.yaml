# Secret scanning settings for the image scans, read by Trivy from the working
# directory. Secret scanning stays on for everything not listed here.
allow-rules:
  # The docstrings of the Anthropic SDK (2.x) mention `{"type": "service_account"}`,
  # which the gcp-service-account rule takes for a key file. Nothing in that
  # package is a secret; the rest of the image is still scanned.
  - id: anthropic-sdk
    description: Docstrings in the Anthropic SDK
    path: \.venv/lib/python[0-9.]+/site-packages/anthropic/
