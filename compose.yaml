services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: garmin
      POSTGRES_DB: garmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see .env.example}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garmin -d garmin"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Also runs the other commands: docker compose run --rm web <command>
  web:
    image: ${APP_IMAGE:-garmin-analyzer:dev}
    build:
      context: .
      dockerfile: Containerfile
    command: ["serve", "--host", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://garmin:${POSTGRES_PASSWORD}@db:5432/garmin
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      # Reachable from this machine only, unless WEB_BIND says otherwise.
      - "${WEB_BIND:-127.0.0.1:8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as r; r.urlopen("http://127.0.0.1:8000/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
